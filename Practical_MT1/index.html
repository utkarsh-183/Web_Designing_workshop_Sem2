<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">
        <h2 style="font-family: Georgia, 'Times New Roman', Times, serif;">
            Reverse the Given Number
        </h2>

        <input type="number" id="num" placeholder="Enter the number :" style="font-weight: 600;">
        
        <button onclick="reverseNumber()" style="background-color: darkslategrey;">
            Reverse
        </button>

        <h3 id="result"></h3>
    </div>

    <script src="script.js"></script>

</body>
</html>
